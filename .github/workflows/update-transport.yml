name: Update transport indicator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-transport.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build transport.json from PortWatch and AIS data
        run: |
          python - <<'PY'
          import json, statistics, requests, re
          from datetime import datetime, timezone, date
          UA={'User-Agent':'DOMINO-dashboard/2.2 (+GitHub Actions)'}; NOW=datetime.now(timezone.utc)
          def get(url):
              r=requests.get(url,timeout=40,headers=UA); r.raise_for_status(); return r.json()
          def norm(x): return re.sub(r'[^a-z0-9]+',' ',str(x).lower()).strip()
          def num(d,keys):
              if not isinstance(d,dict): return None
              for k in keys:
                  v=d.get(k)
                  if isinstance(v,(int,float)): return float(v)
              return None
          def rows_from(root):
              if isinstance(root,list): return root
              if not isinstance(root,dict): return []
              for k in ('chokepoints','items','data','routes','points'):
                  if isinstance(root.get(k),list): return root[k]
              return []
          def identity(item):
              if not isinstance(item,dict): return ''
              return norm(' '.join(str(item[k]) for k in ('id','slug','name','label','chokepoint','route','title') if isinstance(item.get(k),str)))
          def pick(root,aliases):
              aliases=[norm(a) for a in aliases]; best=None; score=-1
              for item in rows_from(root):
                  ident=identity(item); s=max((len(a) for a in aliases if a in ident),default=-1)
                  if s>score: best=item; score=s
              return best if score>=0 else None
          def history(item):
              for k in ('history','rows','series','points'):
                  if isinstance(item.get(k),list): return item[k]
              return []
          def extract(root,aliases):
              item=pick(root,aliases)
              if not item:return None
              latest=item.get('latest') if isinstance(item.get('latest'),dict) else item
              h=history(item)
              def metric(keys):
                  current=num(latest,keys); vals=[num(r,keys) for r in h[-120:]]; vals=[v for v in vals if v is not None]
                  baseline=float(statistics.median(vals[-90:])) if len(vals)>=7 else None
                  return current,baseline
              total,total_base=metric(('nTotal','n_total','transits','total'))
              tanker,tanker_base=metric(('nTanker','n_tanker','tankers','tanker'))
              cargo,cargo_base=metric(('nCargo','n_cargo','cargo'))
              container,container_base=metric(('nContainer','n_container','container'))
              dry,dry_base=metric(('nDryBulk','n_dry_bulk','dryBulk','dry_bulk'))
              general,general_base=metric(('nGeneralCargo','n_general_cargo','generalCargo','general_cargo'))
              goods_vals=[v for v in (cargo,container,dry,general) if v is not None]
              goods_bases=[v for v in (cargo_base,container_base,dry_base,general_base) if v is not None]
              goods=sum(goods_vals) if goods_vals else (total-tanker if total is not None and tanker is not None else None)
              goods_base=sum(goods_bases) if goods_bases else (total_base-tanker_base if total_base is not None and tanker_base is not None else None)
              dt=latest.get('date') or item.get('asOfDate') or item.get('date')
              return {'count':total,'baseline':total_base,'tanker':tanker,'tanker_baseline':tanker_base,'goods':goods,'goods_baseline':goods_base,'date':dt,'identity':identity(item)}
          def status(count,base):
              if count is None or not base:return 'unknown',None
              ratio=count/base; return ('green' if ratio>=.85 else 'yellow' if ratio>=.65 else 'orange' if ratio>=.40 else 'red'),ratio
          def reroute(count,base):
              if count is None or not base:return 'unknown',None
              ratio=count/base; return ('green' if ratio<=1.10 else 'yellow' if ratio<=1.25 else 'orange' if ratio<=1.50 else 'red'),ratio
          old={}
          try: old=json.load(open('transport.json',encoding='utf-8'))
          except: pass
          errors=[]
          try: choke=get('https://straits.live/api/v1/chokepoints?history=1')
          except Exception as e: choke=None; errors.append('chokepoints: '+str(e)[:160])
          try: transits=get('https://straits.live/api/v1/transits?history=1&limit=120')
          except Exception as e: transits=None; errors.append('transits: '+str(e)[:160])
          try: dark=get('https://straits.live/api/v1/ais-gaps')
          except Exception as e: dark=None; errors.append('ais-gaps: '+str(e)[:160])
          raw={
            'bab_el_mandeb':extract(choke,['bab el mandeb','bab al mandab','bab mandeb']) if choke else None,
            'suez':extract(choke,['suez canal','suez']) if choke else None,
            'cape':extract(choke,['cape of good hope','good hope','cape']) if choke else None}
          comps={}; dates=[]
          # Hormuz remains total throughput until its energy-type split is handled separately.
          latest=transits.get('latest',{}) if isinstance(transits,dict) else {}
          hc=num(latest,('nTotal','n_total','transits','total')); hb=num(latest,('preCrisisBaselineMedian','baselineMedian','baseline'))
          hs,hr=status(hc,hb); hd=latest.get('date') if isinstance(latest,dict) else None
          comps['hormuz']={'status':hs,'count':hc,'baseline':hb,'ratio':round(hr,3) if hr is not None else None,'label':'Straße von Hormus'}
          if hd: dates.append(str(hd)[:10])
          # Bab el-Mandeb: tanker traffic alone determines the energy-chokepoint status.
          b=raw['bab_el_mandeb'] or {}; bs,br=status(b.get('tanker'),b.get('tanker_baseline')); gs,gr=status(b.get('goods'),b.get('goods_baseline'))
          comps['bab_el_mandeb']={'status':bs,'count':b.get('tanker'),'baseline':b.get('tanker_baseline'),'ratio':round(br,3) if br is not None else None,'label':'Bab el-Mandeb','energy_basis':'tanker_only','tanker':{'status':bs,'count':b.get('tanker'),'baseline':b.get('tanker_baseline'),'ratio':round(br,3) if br is not None else None},'goods':{'status':gs,'count':b.get('goods'),'baseline':b.get('goods_baseline'),'ratio':round(gr,3) if gr is not None else None},'total_count':b.get('count'),'total_baseline':b.get('baseline')}
          if b.get('date'): dates.append(str(b['date'])[:10])
          for k,label in [('suez','Suez / SUMED'),('cape','Kap der Guten Hoffnung')]:
              r=raw[k] or {}; st,rr=(reroute(r.get('count'),r.get('baseline')) if k=='cape' else status(r.get('count'),r.get('baseline')))
              comps[k]={'status':st,'count':r.get('count'),'baseline':r.get('baseline'),'ratio':round(rr,3) if rr is not None else None,'label':label}
              if r.get('date'): dates.append(str(r['date'])[:10])
          dc=db=None
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          if dark:
              for d in walk(dark):
                  if dc is None: dc=num(d,('count','darkCount','aisDarkCount','current'))
                  if db is None: db=num(d,('baseline','baseline7d','sevenDayBaseline','avg7d','mean7d'))
          if dc is not None and db:
              dr=dc/db; ds='green' if dr<=1.10 else 'yellow' if dr<=1.35 else 'orange' if dr<=1.75 else 'red'
          else: dr=None; ds='unknown'
          comps['ais_dark']={'status':ds,'count':dc,'baseline':db,'ratio':round(dr,3) if dr is not None else None,'label':'Dark-Shipping-Radar'}
          ranks={'unknown':0,'green':0,'yellow':1,'orange':2,'red':3}; weights={'hormuz':.35,'bab_el_mandeb':.20,'suez':.15,'cape':.15,'ais_dark':.15}
          known=[k for k in weights if comps[k]['status']!='unknown']
          if known:
              score=sum(weights[k]*ranks[comps[k]['status']] for k in known)/sum(weights[k] for k in known)
              overall='green' if score<.65 else 'yellow' if score<1.35 else 'orange' if score<2.20 else 'red'
              if comps['hormuz']['status']=='red' and any(comps[k]['status'] in ('orange','red') for k in ('bab_el_mandeb','suez')): overall='red'
          else: score=None; overall='unknown'
          src=max(dates) if dates else old.get('source_date'); oldstatus=old.get('status'); days=1 if overall!=oldstatus else int(old.get('days_in_status') or 1)
          out={'version':'2.2','status':overall,'label':overall.upper() if overall!='unknown' else 'WARTET','summary':{'green':'normal','yellow':'auffällig','orange':'stark gestört','red':'kritisch','unknown':'wartet auf Daten'}[overall],'score':round(score,2) if score is not None else None,'days_in_status':days,'updated_at':NOW.isoformat(),'source_date':src,'components':comps,'rules':{'bab_el_mandeb':'ONLY tanker traffic contributes to Bab el-Mandeb energy status and overall Transport score; goods traffic is context only','main_routes':'green >=85%, yellow 65-<85%, orange 40-<65%, red <40% of baseline','cape':'green <=110%, yellow >110-125%, orange >125-150%, red >150%','ais_dark':'green <=110%, yellow >110-135%, orange >135-175%, red >175%'},'sources':['IMF PortWatch vessel-type chokepoint counts via Straits.live','Straits.live AIS-gap summary'],'note':'TEMPORARY TEST MODE: polls every 15 minutes. Bab el-Mandeb is split into goods and tanker traffic; only tanker status enters the Transport score.','errors':errors}
          with open('transport.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit if changed
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add transport.json
          git diff --cached --quiet || (git commit -m "Update live maritime transport indicator" && git push)
