name: Update transport indicator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-transport.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build transport.json from PortWatch and AIS data
        run: |
          python - <<'PY'
          import json, statistics, requests, re
          from datetime import datetime, timezone, date

          UA={'User-Agent':'DOMINO-dashboard/2.1 (+GitHub Actions)'}
          NOW=datetime.now(timezone.utc)

          def get(url):
              r=requests.get(url,timeout=40,headers=UA)
              r.raise_for_status()
              return r.json()

          def norm(x):
              return re.sub(r'[^a-z0-9]+',' ',str(x).lower()).strip()

          def num(d, keys):
              if not isinstance(d,dict): return None
              for k in keys:
                  v=d.get(k)
                  if isinstance(v,(int,float)): return float(v)
              return None

          def rows_from(root):
              if isinstance(root,list): return root
              if not isinstance(root,dict): return []
              for k in ('chokepoints','items','data','routes','points'):
                  v=root.get(k)
                  if isinstance(v,list): return v
              return []

          def history_from(item):
              if not isinstance(item,dict): return []
              for k in ('history','rows','series','points'):
                  v=item.get(k)
                  if isinstance(v,list): return v
              return []

          def identity(item):
              if not isinstance(item,dict): return ''
              vals=[]
              for k in ('id','slug','name','label','chokepoint','route','title'):
                  if k in item and isinstance(item[k],str): vals.append(item[k])
              return norm(' '.join(vals))

          def pick_item(root, aliases):
              aliases=[norm(a) for a in aliases]
              best=None; bestscore=-1
              for item in rows_from(root):
                  ident=identity(item)
                  score=max((len(a) for a in aliases if a and a in ident), default=-1)
                  if score>bestscore:
                      best=item; bestscore=score
              return best if bestscore>=0 else None

          def extract_item(root, aliases):
              item=pick_item(root,aliases)
              if not item: return None
              latest=item.get('latest') if isinstance(item.get('latest'),dict) else item
              count=num(latest,('nTotal','n_total','transits','total'))
              baseline=num(latest,('preCrisisBaselineMedian','pre_crisis_baseline_median','baselineMedian','baseline','median','typical'))
              if baseline is None:
                  baseline=num(item,('preCrisisBaselineMedian','pre_crisis_baseline_median','baselineMedian','baseline','median','typical'))
              hist=history_from(item)
              vals=[]
              for r in hist[-120:]:
                  v=num(r,('nTotal','n_total','transits','total'))
                  if v is not None: vals.append(v)
              if baseline is None and len(vals)>=7:
                  baseline=float(statistics.median(vals[-90:]))
              dt=(latest.get('date') if isinstance(latest,dict) else None) or item.get('asOfDate') or item.get('date')
              return {'count':count,'baseline':baseline,'date':dt,'identity':identity(item)}

          def disruption(r):
              if not r or not r.get('baseline') or r.get('count') is None: return 'unknown',None
              ratio=r['count']/r['baseline']
              return ('green' if ratio>=0.85 else 'yellow' if ratio>=0.65 else 'orange' if ratio>=0.40 else 'red'),ratio

          def reroute(r):
              if not r or not r.get('baseline') or r.get('count') is None: return 'unknown',None
              ratio=r['count']/r['baseline']
              return ('green' if ratio<=1.10 else 'yellow' if ratio<=1.25 else 'orange' if ratio<=1.50 else 'red'),ratio

          old={}
          try:
              old=json.load(open('transport.json',encoding='utf-8'))
          except Exception:
              pass

          errors=[]
          choke=dark=transits=None
          try: choke=get('https://straits.live/api/v1/chokepoints?history=1')
          except Exception as e: errors.append('chokepoints: '+str(e)[:160])
          try: transits=get('https://straits.live/api/v1/transits?history=1&limit=120')
          except Exception as e: errors.append('transits: '+str(e)[:160])
          try: dark=get('https://straits.live/api/v1/ais-gaps')
          except Exception as e: errors.append('ais-gaps: '+str(e)[:160])

          # Hormuz gets its authoritative value and published pre-crisis baseline directly
          # from /transits. The comparison endpoint is used for the other routes.
          hormuz=None
          if isinstance(transits,dict):
              latest=transits.get('latest') if isinstance(transits.get('latest'),dict) else {}
              hormuz={
                  'count':num(latest,('nTotal','n_total','transits','total')),
                  'baseline':num(latest,('preCrisisBaselineMedian','pre_crisis_baseline_median','baselineMedian','baseline')),
                  'date':latest.get('date') or transits.get('asOfDate') or transits.get('asOf'),
                  'identity':'hormuz via /transits'
              }

          raw={
            'hormuz':hormuz,
            'bab_el_mandeb':extract_item(choke,['bab el mandeb','bab al mandab','bab mandeb']) if choke else None,
            'suez':extract_item(choke,['suez','suez canal']) if choke else None,
            'cape':extract_item(choke,['cape of good hope','good hope','cape']) if choke else None,
          }

          comps={}
          labels={'hormuz':'Straße von Hormus','bab_el_mandeb':'Bab el-Mandeb','suez':'Suez / SUMED','cape':'Kap der Guten Hoffnung'}
          source_dates=[]
          for k,r in raw.items():
              st,ratio=(reroute(r) if k=='cape' else disruption(r))
              if r and r.get('date'): source_dates.append(str(r['date'])[:10])
              comps[k]={
                  'status':st,
                  'count':r.get('count') if r else None,
                  'baseline':r.get('baseline') if r else None,
                  'ratio':round(ratio,3) if ratio is not None else None,
                  'label':labels[k],
                  'source_identity':r.get('identity') if r else None
              }

          # Free AIS-gap endpoint: current dark-tanker count plus 7-day baseline.
          dc=db=None
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          if dark:
              for d in walk(dark):
                  if dc is None: dc=num(d,('count','darkCount','aisDarkCount','current'))
                  if db is None: db=num(d,('baseline','baseline7d','sevenDayBaseline','avg7d','mean7d'))
          if dc is not None and db and db>0:
              dr=dc/db
              ds='green' if dr<=1.10 else 'yellow' if dr<=1.35 else 'orange' if dr<=1.75 else 'red'
          else:
              dr=None; ds='unknown'
          comps['ais_dark']={'status':ds,'count':dc,'baseline':db,'ratio':round(dr,3) if dr is not None else None,'label':'Dark-Shipping-Radar'}

          ranks={'unknown':0,'green':0,'yellow':1,'orange':2,'red':3}
          weights={'hormuz':0.35,'bab_el_mandeb':0.20,'suez':0.15,'cape':0.15,'ais_dark':0.15}
          known=[k for k,v in comps.items() if v['status']!='unknown']
          if known:
              score=sum(weights[k]*ranks[comps[k]['status']] for k in known)/sum(weights[k] for k in known)
              overall='green' if score<0.65 else 'yellow' if score<1.35 else 'orange' if score<2.20 else 'red'
              if comps['hormuz']['status']=='red' and any(comps[k]['status'] in ('orange','red') for k in ('bab_el_mandeb','suez')):
                  overall='red'
          else:
              score=None; overall='unknown'

          summary={'green':'normal','yellow':'auffällig','orange':'stark gestört','red':'kritisch','unknown':'wartet auf Daten'}[overall]
          src=max(source_dates) if source_dates else old.get('source_date')
          old_status=old.get('status'); old_days=int(old.get('days_in_status') or 1)
          if overall=='unknown':
              days=old_days if old_status and old_status!='unknown' else None
          elif old_status==overall:
              old_src=old.get('source_date')
              try: delta=(date.fromisoformat(src)-date.fromisoformat(old_src)).days if src and old_src else 0
              except Exception: delta=0
              days=max(1,old_days+max(0,delta))
          else:
              days=1

          out={
            'version':'2.1','status':overall,'label':overall.upper() if overall!='unknown' else 'WARTET',
            'summary':summary,'score':round(score,2) if score is not None else None,
            'days_in_status':days,'updated_at':NOW.isoformat(),'source_date':src,
            'components':comps,
            'rules':{
              'main_routes':'green >=85%, yellow 65-<85%, orange 40-<65%, red <40% of baseline transit count',
              'cape':'green <=110%, yellow >110-125%, orange >125-150%, red >150% of baseline',
              'ais_dark':'green <=110%, yellow >110-135%, orange >135-175%, red >175% of 7-day baseline'
            },
            'sources':['IMF PortWatch daily chokepoint transit counts via Straits.live open API','Straits.live free AIS-gap summary'],
            'note':'TEMPORARY TEST MODE: workflow polls every 15 minutes until all four chokepoint parsers are verified. IMF PortWatch itself publishes weekly with lag.',
            'errors':errors
          }
          with open('transport.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit if changed
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add transport.json
          git diff --cached --quiet || (git commit -m "Update live maritime transport indicator" && git push)
