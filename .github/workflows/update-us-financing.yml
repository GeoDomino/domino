name: Update US financing stress

on:
  workflow_dispatch:
  schedule:
    - cron: '40 20 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-us-financing.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch Treasury auctions and Fed intervention state
        run: |
          python - <<'PY'
          import json, statistics, requests, re
          from datetime import datetime, timezone, date, timedelta
          from pathlib import Path
          from bs4 import BeautifulSoup

          API='https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/od/auctions_query'
          FIELDS='cusip,security_type,security_term,original_security_term,auction_date,issue_date,reopening,tips,floating_rate,bid_to_cover_ratio,total_accepted,primary_dealer_accepted,direct_bidder_accepted,indirect_bidder_accepted,high_yield,high_discnt_rate'
          today=date.today()
          start=(today-timedelta(days=220)).isoformat()
          params={'format':'json','fields':FIELDS,'filter':f'auction_date:gte:{start}','sort':'-auction_date','page[size]':'1000'}
          r=requests.get(API,params=params,timeout=40,headers={'User-Agent':'GeoDomino/1.0'})
          r.raise_for_status()
          rows=r.json().get('data',[])

          def num(v):
              try:
                  if v in (None,'','null'): return None
                  return float(v)
              except: return None

          def is_relevant(x):
              # Coupon market is the cleanest absorption test. Bills are frequent and would dominate the signal.
              return x.get('security_type') in ('Note','Bond') and num(x.get('bid_to_cover_ratio')) is not None and x.get('auction_date') <= today.isoformat()

          auctions=[x for x in rows if is_relevant(x)]
          if not auctions:
              raise RuntimeError('No completed Note/Bond auctions returned by FiscalData')

          def key(x):
              return (x.get('original_security_term') or x.get('security_term') or '', x.get('tips') or '', x.get('floating_rate') or '')

          def shares(x):
              total=num(x.get('total_accepted'))
              if not total or total<=0: return None,None
              dealer=num(x.get('primary_dealer_accepted'))
              indirect=num(x.get('indirect_bidder_accepted'))
              return (dealer/total*100 if dealer is not None else None, indirect/total*100 if indirect is not None else None)

          def median(vals):
              vals=[v for v in vals if v is not None]
              return statistics.median(vals) if vals else None

          def auction_level(cur):
              same=[x for x in auctions if key(x)==key(cur) and x.get('auction_date') < cur.get('auction_date')][:8]
              btc=num(cur.get('bid_to_cover_ratio'))
              cdealer,cind=shares(cur)
              btc_med=median([num(x.get('bid_to_cover_ratio')) for x in same])
              d_med=median([shares(x)[0] for x in same])
              i_med=median([shares(x)[1] for x in same])
              dims=[]
              if btc is not None and btc_med:
                  q=btc/btc_med
                  dims.append(0 if q>=0.97 else 1 if q>=0.93 else 2 if q>=0.88 else 3)
              if cdealer is not None and d_med:
                  q=cdealer/d_med
                  dims.append(0 if q<=1.10 else 1 if q<=1.25 else 2 if q<=1.45 else 3)
              if cind is not None and i_med:
                  q=cind/i_med
                  dims.append(0 if q>=0.92 else 1 if q>=0.82 else 2 if q>=0.70 else 3)
              if not dims:
                  level=0
              else:
                  # Bid-to-cover is most important; dealer/indirect composition confirms weakness.
                  level=max(dims[0], round(sum(dims)/len(dims)))
              level=max(0,min(3,int(level)))
              return level,btc_med,d_med,i_med,cdealer,cind

          evaluated=[]
          for x in auctions[:12]:
              lev,btc_med,d_med,i_med,dealer,indirect=auction_level(x)
              term=x.get('original_security_term') or x.get('security_term') or x.get('security_type')
              evaluated.append({
                  'date':x.get('auction_date'),'security':term,'cusip':x.get('cusip'),
                  'bid_to_cover':num(x.get('bid_to_cover_ratio')),
                  'bid_to_cover_baseline':round(btc_med,3) if btc_med is not None else None,
                  'dealer_share_pct':round(dealer,1) if dealer is not None else None,
                  'dealer_baseline_pct':round(d_med,1) if d_med is not None else None,
                  'indirect_share_pct':round(indirect,1) if indirect is not None else None,
                  'indirect_baseline_pct':round(i_med,1) if i_med is not None else None,
                  'high_yield':num(x.get('high_yield')),
                  'level':lev,'status':['green','yellow','orange','red'][lev]
              })

          latest=evaluated[0]
          last3=evaluated[:3]
          weights=[0.60,0.25,0.15]
          recent_score=sum(a['level']*weights[i] for i,a in enumerate(last3)) / sum(weights[:len(last3)])
          # Repeated serious weakness is more important than one noisy print.
          if sum(a['level']>=2 for a in last3)>=2: recent_score=max(recent_score,1.5)
          if sum(a['level']==3 for a in last3)>=2: recent_score=max(recent_score,2.5)
          if recent_score>=2.5: level=3
          elif recent_score>=1.5: level=2
          elif recent_score>=0.75: level=1
          else: level=0
          status=['green','yellow','orange','red'][level]
          label=['GRÜN','GELB','ORANGE','ROT'][level]

          old={}
          p=Path('us-financing.json')
          if p.exists():
              try: old=json.loads(p.read_text(encoding='utf-8'))
              except: old={}

          def inclusive_days(s):
              try: return max(1,(today-date.fromisoformat(s)).days+1)
              except: return 1

          if old.get('status')==status and old.get('status_since'):
              status_since=old['status_since']
          else:
              status_since=today.isoformat()

          # Fed intervention layer. Normal reinvestment, rollovers and reserve-management purchases are excluded.
          fed_urls=[
            'https://www.newyorkfed.org/markets/domestic-market-operations/monetary-policy-implementation/treasury-securities/treasury-securities-operational-details',
            'https://www.newyorkfed.org/markets/domestic-market-operations'
          ]
          evidence=[]
          text=''
          for u in fed_urls:
              try:
                  rr=requests.get(u,timeout=30,headers={'User-Agent':'GeoDomino/1.0'})
                  rr.raise_for_status()
                  t=' '.join(BeautifulSoup(rr.text,'html.parser').stripped_strings)
                  text += ' '+t[:22000]
              except Exception as e:
                  evidence.append('Fed-Seite nicht lesbar: '+str(e)[:90])
          low=text.lower()
          fast_terms=['restore smooth market functioning','severe market disruption','market dysfunction','emergency treasury purchases','support the smooth functioning of the treasury market']
          slow_terms=['additional treasury purchase operations','temporary treasury purchase operations','market functioning purchases','address strains in the treasury market']
          fast_hit=next((t for t in fast_terms if t in low),None)
          slow_hit=next((t for t in slow_terms if t in low),None)
          if fast_hit:
              istate,ilabel,ispeed='fast','SCHNELLE INTERVENTION',2
              evidence.append('NY Fed: '+fast_hit)
          elif slow_hit:
              istate,ilabel,ispeed='slow','INTERVENTION',1
              evidence.append('NY Fed: '+slow_hit)
          else:
              istate,ilabel,ispeed='stopped','KEIN AUSSERORDENTLICHER EINGRIFF',0
              evidence.append('Keine explizite Treasury-Marktstress-Intervention auf den geprüften NY-Fed-Seiten erkannt.')

          oldi=old.get('intervention') or {}
          if oldi.get('state')==istate and oldi.get('state_since'):
              state_since=oldi['state_since']
          else:
              state_since=today.isoformat()

          out={
            'version':'1.1','status':status,'label':label,'level':level,'score':round(recent_score,2),
            'status_since':status_since,'days_in_status':inclusive_days(status_since),
            'updated_at':datetime.now(timezone.utc).isoformat(),
            'financing_plan':{'period':'Jul–Dez 2026','net_market_borrowing_usd_bn':1367,'q3_usd_bn':739,'q4_usd_bn':628},
            'latest_auction':latest,'recent_auctions':evaluated[:6],
            'intervention':{
              'state':istate,'label':ilabel,'state_since':state_since,'days_in_state':inclusive_days(state_since),
              'speed':ispeed,'reason':'Normale SOMA-Rollover, Reinvestments und Reserve-Management-Käufe zählen nicht. Nur zusätzliche Maßnahmen wegen Treasury-Marktstress bewegen den Pfeil.',
              'evidence':evidence
            },
            'thresholds':{
              'auction':'Vergleich jeder Auktion mit bis zu 8 vorigen Auktionen gleicher Laufzeit: Bid-to-Cover, Primary-Dealer-Anteil und Indirect-Bidder-Anteil.',
              'combined':'Letzte Auktion 60 %, vorletzte 25 %, drittletzte 15 %. Zwei ernst schwache Auktionen in drei erzwingen mindestens Orange; zwei rote erzwingen Rot.'
            },
            'method':'Täglicher offizieller FiscalData-Abruf relevanter Treasury Notes/Bonds. Bills werden wegen ihrer hohen Frequenz nicht zur Ampelwertung benutzt. Fed-Pfeil separat und konservativ: normale Geldmarkt-/Reserveoperationen zählen nicht als Krisenintervention.'
          }
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit data
        run: |
          git config user.name 'DOMINO Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add us-financing.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update US financing stress indicator'
            git pull --rebase origin main
            git push
          fi
