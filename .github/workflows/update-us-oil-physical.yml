name: Update US physical oil supply

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-us-oil-physical.yml'
  schedule:
    - cron: '20 16 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas lxml requests
      - name: Fetch EIA weekly physical oil data
        run: |
          python - <<'PY'
          import io, json, math, re, requests, pandas as pd
          from datetime import datetime, timezone
          UA={'User-Agent':'DOMINO-dashboard/3.0 (+GitHub Actions)'}
          SOURCES={'canada_imports':'https://www.eia.gov/dnav/pet/pet_move_wimpc_s1_w.htm','commercial_crude_stocks':'https://www.eia.gov/dnav/pet/pet_stoc_wstk_a_EPC0_SAX_mbbl_w.htm','total_crude_imports':'https://www.eia.gov/dnav/pet/pet_move_wkly_a_epc0_imx_mbblpd_w.htm','domestic_production':'https://www.eia.gov/dnav/pet/pet_sum_sndw_a_epc0_fpf_mbblpd_w.htm','refinery_inputs':'https://www.eia.gov/dnav/pet/pet_pnp_wiup_a_epc0_yiy_mbblpd_w.htm'}
          def num(x):
            try:
              v=float(str(x).replace(',','').strip()); return v if math.isfinite(v) else None
            except:return None
          def read_series(url,needle):
            html=requests.get(url,timeout=60,headers=UA).text
            for df in pd.read_html(io.StringIO(html)):
              for _,row in df.iterrows():
                if needle(str(row.iloc[0]).lower()):
                  vals=[v for x in row.iloc[1:] if (v:=num(x)) is not None]
                  if len(vals)>=5:
                    dates=[]
                    for c in df.columns:
                      txt=' '.join(map(str,c)) if isinstance(c,tuple) else str(c); m=re.search(r'(\d{2}/\d{2}/\d{2})',txt)
                      if m: dates.append(pd.to_datetime(m.group(1)).date())
                    return vals[-6:],(max(dates).isoformat() if dates else None)
            raise RuntimeError('series not found '+url)
          can,dc=read_series(SOURCES['canada_imports'],lambda s:'canada' in s); stk,ds=read_series(SOURCES['commercial_crude_stocks'],lambda s:s.strip() in ('u.s.','u.s')); imp,di=read_series(SOURCES['total_crude_imports'],lambda s:s.strip() in ('u.s.','u.s')); pro,dp=read_series(SOURCES['domestic_production'],lambda s:s.strip() in ('u.s.','u.s')); ref,dr=read_series(SOURCES['refinery_inputs'],lambda s:s.strip() in ('u.s.','u.s'))
          def metric(vals,scale,cuts,comparison='4w_average'):
            latest=vals[-1]*scale; base=(vals[-2]*scale if comparison=='previous_week' else sum(vals[-5:-1])/4*scale); dev=(latest/base-1)*100 if base else 0
            lvl=3 if dev<=cuts[2] else 2 if dev<=cuts[1] else 1 if dev<=cuts[0] else 0
            return latest,base,dev,lvl
          C=metric(can,.001,(-5,-10,-20),'previous_week'); S=metric(stk,.001,(-2,-5,-10),'previous_week'); I=metric(imp,.001,(-5,-10,-20),'previous_week'); P=metric(pro,.001,(-1,-2.5,-5)); R=metric(ref,.001,(-2,-5,-10))
          weights={'canada_imports':.30,'commercial_crude_stocks':.30,'total_crude_imports':.15,'domestic_production':.15,'refinery_inputs':.10}; vals={'canada_imports':C,'commercial_crude_stocks':S,'total_crude_imports':I,'domestic_production':P,'refinery_inputs':R}; score=sum(weights[k]*vals[k][3] for k in weights)
          level=3 if score>=2 else 2 if score>=1.25 else 1 if score>=.5 else 0
          if C[3]>=2 and I[3]>=2 and S[3]>=2: level=max(level,3)
          elif sum(x[3]>=2 for x in (C,S,I,P,R))>=3: level=max(level,2)
          labels=['GRÜN','GELB','ORANGE','ROT']; status=['green','yellow','orange','red'][level]; dates=[x for x in (dc,ds,di,dp,dr) if x]; source_date=max(dates) if dates else None
          def obj(label,x,weight,unit,comparison='4w_average'):
            out={'label':label,'weight':weight,'level':x[3],'value':round(x[0],3),'deviation_pct':round(x[2],2),'unit':unit,'comparison':comparison}; out['previous_week' if comparison=='previous_week' else 'baseline_4w']=round(x[1],3); return out
          out={'version':'1.3','status':status,'label':labels[level],'level':level,'score':round(score,2),'source_date':source_date,'updated_at':datetime.now(timezone.utc).isoformat(),'components':{'canada_imports':obj('Kanada → USA Rohöl',C,30,'mb/d','previous_week'),'commercial_crude_stocks':obj('Kommerzielle Rohöllager',S,30,'Mio. bbl','previous_week'),'total_crude_imports':obj('Gesamte Rohölimporte',I,15,'mb/d','previous_week'),'domestic_production':obj('US-Rohölförderung',P,15,'mb/d'),'refinery_inputs':obj('Raffinerie-Rohöleinsatz',R,10,'mb/d')},'sources':SOURCES,'method':'Kanada → USA Rohöl, kommerzielle Rohöllager und gesamte Rohölimporte: neuester EIA-Wochenwert gegen unmittelbare Vorwoche. US-Förderung und Raffinerieeinsatz: neuester Wochenwert gegen Mittel der vier vorangegangenen Wochen; 30/30/15/15/10 gewichtet.'}
          with open('us-oil-physical.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2);f.write('\n')
          try: oil=json.load(open('oil-supply.json',encoding='utf-8'))
          except: oil={}
          oil.setdefault('components',{})['us_physical_supply']={'sensor':4,'status':status,'points':level,'value':round(score,2),'unit':'weighted stress 0-3','label':'Sensor 4 Ölversorgung · US-Ölversorgung physisch','date':source_date,'source':'U.S. EIA Weekly Petroleum Data','detail_file':'us-oil-physical.json'}; oil['sensor4_updated']=out['updated_at']; oil['sensor4_source_date']=source_date
          existing=[oil['components'].get(k,{}) for k in ('supply_demand_balance','spare_capacity','unplanned_outages','us_physical_supply')]; pts=[int(x.get('points',0)) for x in existing]; reds=sum(x.get('status')=='red' for x in existing); total=sum(pts); overall='red' if reds>=2 or total>=9 else 'orange' if total>=6 else 'yellow' if total>=3 else 'green'; oil['status']=overall; oil['label']={'green':'GRÜN','yellow':'GELB','orange':'ORANGE','red':'ROT'}[overall]; oil['score']=total; oil['version']='2.3'; oil['aggregation']={'method':'four_verified_sensors_v1','points_total':total,'points_max':12,'red_sensors':reds}; oil['note']='DOMINO Ölversorgung: Gesamtampel aus globaler Balance, OPEC-Reserve, ungeplanten Ausfällen und physischer US-Ölversorgung.'
          with open('oil-supply.json','w',encoding='utf-8') as f: json.dump(oil,f,ensure_ascii=False,indent=2);f.write('\n')
          PY
      - name: Commit data
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add us-oil-physical.json oil-supply.json
          if ! git diff --cached --quiet; then
            git commit -m "Update physical US oil supply"
            git pull --rebase origin main
            git push
          fi
