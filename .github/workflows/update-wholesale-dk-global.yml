name: Update wholesale DK global

on:
  workflow_dispatch:
  schedule:
    # Candidate UTC hours. The script gates each market by its real local time,
    # so DST in Europe/New York is handled by zoneinfo instead of hard-coded UTC.
    - cron: "0 2,7,8,9,13,14,15,19,20 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Europe + Asia and calculate East-West spread
        shell: python
        run: |
          import json, math, statistics, urllib.request, os, re
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          MANUAL = os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch'
          now = datetime.now(timezone.utc)

          markets = {
            'eu': {
              'name':'Europa','tz':'Europe/Amsterdam','ticker':'LGO=F',
              'benchmark':'ICE Low Sulphur Gasoil Futures (delayed Yahoo quote)',
              'unit':'USD/t','thresholds':[900,1200,1500],
              'file':'wholesale-dk-eu.json'
            },
            'asia': {
              'name':'Asien','tz':'Asia/Singapore','ticker':'SGB=F',
              'benchmark':'NYMEX Singapore Gasoil (Platts) Futures (delayed Yahoo quote)',
              'unit':'USD/bbl','thresholds':[100,125,150],
              'file':'wholesale-dk-asia.json'
            }
          }

          def due(cfg):
              if MANUAL: return True
              local=now.astimezone(ZoneInfo(cfg['tz']))
              return local.weekday()<5 and local.hour in (10,15)

          def yahoo(ticker):
              url=f'https://query1.finance.yahoo.com/v8/finance/chart/{ticker}?range=1y&interval=1d&includePrePost=false'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 DOMINO/1.0'})
              raw=json.load(urllib.request.urlopen(req,timeout=30))
              r=raw['chart']['result'][0]
              meta=r['meta']; ts=r.get('timestamp') or []
              closes=((r.get('indicators') or {}).get('quote') or [{}])[0].get('close') or []
              hist=[]
              for t,v in zip(ts,closes):
                  if v is None: continue
                  d=datetime.fromtimestamp(t,timezone.utc).date().isoformat()
                  hist.append((d,float(v)))
              price=meta.get('regularMarketPrice')
              if price is None and hist: price=hist[-1][1]
              if price is None: raise RuntimeError(f'No quote for {ticker}')
              return float(price), hist

          def public_europe_gasoil():
              url='https://www.oilpriceapi.com/live/gasoil-price'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 DOMINO/1.0'})
              html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
              m=re.search(r'ICE Gasoil \(Rotterdam\) Price[\\s\\S]{0,4000}?\\$([0-9,]+(?:\\.[0-9]+)?)',html,re.I)
              if not m: raise RuntimeError('No public Europe gasoil quote found')
              return float(m.group(1).replace(',','')), []

          def level(value, t):
              return 0 if value<t[0] else 1 if value<t[1] else 2 if value<t[2] else 3

          def save_market(cfg, value, hist, source='Yahoo Finance delayed futures quote'):
              lvl=level(value,cfg['thresholds'])
              source_date=hist[-1][0] if hist else now.date().isoformat()
              old={}
              try: old=json.load(open(cfg['file']))
              except: pass
              if old.get('level')==lvl:
                  days=max(1,int(old.get('days_in_status') or 1))
                  if old.get('source_date') and old.get('source_date')!=source_date:
                      try:
                          a=datetime.fromisoformat(old['source_date']).date(); b=datetime.fromisoformat(source_date).date()
                          days=max(1,days+(b-a).days)
                      except: pass
              else: days=1
              out={
                'market':cfg['name'],'benchmark':cfg['benchmark'],'ticker':cfg['ticker'],
                'value':round(value,3),'unit':cfg['unit'],'source_date':source_date,
                'updated_at':now.isoformat(),'status':['green','yellow','orange','red'][lvl],
                'level':lvl,'days_in_status':days,'source':source,
                'thresholds':{'green_below':cfg['thresholds'][0],'yellow_from':cfg['thresholds'][0],
                              'orange_from':cfg['thresholds'][1],'red_from':cfg['thresholds'][2]},
                'history':[{'date':d,'value':round(v,3)} for d,v in hist[-260:]]
              }
              json.dump(out,open(cfg['file'],'w'),indent=2,ensure_ascii=False)
              return out

          data={}
          for key,cfg in markets.items():
              if not due(cfg):
                  try: data[key]=json.load(open(cfg['file']))
                  except: pass
                  continue
              try:
                  v,h=yahoo(cfg['ticker']); data[key]=save_market(cfg,v,h)
                  print(cfg['name'],v,cfg['unit'])
              except Exception as e:
                  print('WARN primary',cfg['name'],e)
                  if key=='eu':
                      try:
                          v,h=public_europe_gasoil()
                          data[key]=save_market(cfg,v,h,'OilPriceAPI public ICE Gasoil reference page')
                          print(cfg['name'],'fallback',v,cfg['unit'])
                          continue
                      except Exception as fallback_error:
                          print('WARN fallback',cfg['name'],fallback_error)
                  try: data[key]=json.load(open(cfg['file']))
                  except: pass

          # East-West model: compare Singapore USD/bbl with European gasoil converted
          # from USD/t using 7.45 bbl/t. This is a transparent model, not a proprietary
          # Platts EFS assessment. Stress thresholds are empirical percentiles from the
          # rolling history, not fixed guessed dollar values.
          if 'eu' in data and 'asia' in data:
              eu_hist={x['date']:x['value'] for x in data['eu'].get('history',[])}
              as_hist={x['date']:x['value'] for x in data['asia'].get('history',[])}
              common=sorted(set(eu_hist)&set(as_hist))
              series=[]
              for d in common:
                  eub=eu_hist[d]/7.45
                  s=as_hist[d]-eub
                  series.append({'date':d,'spread':s})
              if series:
                  vals=[x['spread'] for x in series[-180:]]
                  current=(data['asia']['value']-(data['eu']['value']/7.45))
                  med=statistics.median(vals)
                  deviations=[abs(x-med) for x in vals]
                  abs_dev=abs(current-med)
                  dev_pct=100.0*sum(x<=abs_dev for x in deviations)/len(deviations)
                  changes=[abs(vals[i]-vals[i-1]) for i in range(1,len(vals))]
                  chg=abs(current-vals[-1]) if vals else 0.0
                  speed_pct=(100.0*sum(x<=chg for x in changes)/len(changes)) if changes else 0.0
                  score=max(dev_pct,speed_pct)
                  state='still' if score<90 else 'slow' if score<97.5 else 'fast'
                  direction='cw' if (current-vals[-1] if vals else 0)>=0 else 'ccw'
                  old={}
                  try: old=json.load(open('wholesale-dk-spread.json'))
                  except: pass
                  days=max(1,int(old.get('days_in_state') or 1)+1) if old.get('state')==state and old.get('source_date')!=now.date().isoformat() else (max(1,int(old.get('days_in_state') or 1)) if old.get('state')==state else 1)
                  out={
                    'name':'Ost-West Spread','method':'Singapore SGB minus ICE LGO converted at 7.45 bbl/t',
                    'value_usd_bbl':round(current,3),'baseline_median':round(med,3),
                    'deviation_percentile':round(dev_pct,1),'speed_percentile':round(speed_pct,1),
                    'stress_score':round(score,1),'state':state,'direction':direction,
                    'days_in_state':days,'source_date':now.date().isoformat(),'updated_at':now.isoformat(),
                    'rules':{'still':'<90th percentile','slow':'90th–<97.5th percentile','fast':'≥97.5th percentile'},
                    'note':'DOMINO model spread; not a proprietary Platts/ICE EFS assessment.',
                    'history':[{'date':x['date'],'spread':round(x['spread'],3)} for x in series[-180:]]
                  }
                  json.dump(out,open('wholesale-dk-spread.json','w'),indent=2,ensure_ascii=False)

      - name: Commit
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add wholesale-dk-eu.json wholesale-dk-asia.json wholesale-dk-spread.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update global wholesale diesel markets" && git push)
