name: Update oil supply indicator

on:
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aggregate verified oil supply sensors
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          with open('oil-supply.json', encoding='utf-8') as f:
              data = json.load(f)

          components = data.get('components', {})
          required = ['supply_demand_balance', 'spare_capacity', 'unplanned_outages']
          missing = [k for k in required if components.get(k, {}).get('status') not in ('green','yellow','orange','red')]
          if missing:
              raise RuntimeError('Oil supply sensors not ready: ' + ', '.join(missing))

          points = [int(components[k].get('points', 0)) for k in required]
          total = sum(points)
          # Three verified sensors, each 0..3 points. Crisis interaction matters:
          # two red sensors are enough for an overall red oil-supply signal.
          red_count = sum(components[k]['status'] == 'red' for k in required)
          orange_or_worse = sum(components[k]['status'] in ('orange','red') for k in required)

          if red_count >= 2 or total >= 7:
              overall = 'red'
          elif total >= 5 or orange_or_worse >= 2:
              overall = 'orange'
          elif total >= 2:
              overall = 'yellow'
          else:
              overall = 'green'

          labels = {'green':'GRÜN','yellow':'GELB','orange':'ORANGE','red':'ROT'}
          data['version'] = '2.2'
          data['status'] = overall
          data['label'] = labels[overall]
          data['score'] = total
          data['updated'] = datetime.now(timezone.utc).isoformat()
          dates = [components[k].get('date') for k in required if components[k].get('date')]
          data['source_date'] = max(dates) if dates else None
          data['note'] = ('DOMINO Ölversorgung: Gesamtampel aus den drei verifizierten Sensoren '
                          'Angebot/Nachfrage, OPEC-Reservekapazität und ungeplante Produktionsausfälle.')
          data['aggregation'] = {
              'method': 'three_verified_sensors_v1',
              'points_total': total,
              'points_max': 9,
              'red_sensors': red_count,
              'orange_or_red_sensors': orange_or_worse
          }

          with open('oil-supply.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print(json.dumps({'status':overall,'score':total,'red_sensors':red_count},ensure_ascii=False))
          PY
      - name: Commit if changed
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add oil-supply.json
          git diff --cached --quiet || (git commit -m "Update oil supply indicator" && git push)
