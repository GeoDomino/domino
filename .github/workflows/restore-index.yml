name: Restore DOMINO index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore working dashboard and apply current UI scripts
        run: |
          python - <<'PY'
          import re, subprocess

          base = subprocess.check_output([
              'git','show','be6719c648ebd72023c61049f1e15f08a8e8f1d9:index.html'
          ], text=True)

          base = base.replace('--card:#181b21;', '--card:#242932;')
          base = base.replace(
              ".refresh{position:absolute;right:14px;top:10px;width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:var(--card);color:var(--text);font-size:22px;line-height:34px;text-align:center;padding:0;cursor:pointer}",
              ".refresh{position:absolute;right:14px;top:10px;width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.24);background:#353c48;color:var(--text);font-size:22px;line-height:34px;text-align:center;padding:0;cursor:pointer;transition:background .12s,transform .12s}.refresh:active{background:#596273;transform:scale(.94)}"
          )
          base = base.replace(
              ".card{background:var(--card);border-radius:17px;padding:13px 10px;text-align:center;border:1px solid rgba(255,255,255,.05);min-height:150px}",
              ".card{background:var(--card);border-radius:17px;padding:13px 10px;text-align:center;border:1px solid rgba(255,255,255,.12);min-height:150px}"
          )

          old_items = "let items=[['Tankstellenpreise DK','Deutschland / USA'],['Kraftstoff-Großhandel','Diesel / Benzin'],['Petrochemie / Chemie','Vorprodukte'],['Straßengüterverkehr','Logistik'],['Luftfahrt / Kerosin','Jet Fuel'],['Landwirtschaft','Lebensmittel'],['Industrieproduktion','Schwerindustrie'],['Lieferketten','Warenpreise']];"
          new_items = "let items=[['Tankstellenpreise DK','Deutschland / USA'],['Kraftstoff-Großhandel','DK / Derivate'],['Petrochemie / Chemie','Vorprodukte'],['Industrieproduktion','Schwerindustrie'],['Halbleiter','Computerchips'],['Grundnahrungsmittel','Weizen · Reis · Mais'],['Straßengüterverkehr','Logistik'],['Lieferketten','Warenpreise']];"
          base = base.replace(old_items, new_items)

          base = base.replace('<div class="rule"><b>5 · Luftfahrt / Kerosin</b><br>Jet-Fuel-Preise, Verfügbarkeit und Belastung der Luftfahrt. Besonders relevant für Luftfracht und internationale Lieferketten.</div><div class="rule"><b>6 · Landwirtschaft / Lebensmittel</b><br>Diesel, Dünger, Chemie, Trocknung, Verarbeitung und Transport treffen hier zusammen. Ziel ist zu erkennen, ob Energie- und Vorproduktkosten in landwirtschaftliche Produktion und Lebensmittelketten durchschlagen.</div><div class="rule"><b>7 · Industrieproduktion</b><br>Beobachtet, ob energie- und rohstoffintensive Produktion tatsächlich zurückgeht. Hier können auch Gas/LNG- und Stromstress indirekt sichtbar werden, etwa über Stahl, Glas, Zement, Papier oder andere energieintensive Branchen.</div><div class="rule"><b>8 · Lieferketten / Warenpreise</b>', '<div class="rule"><b>5 · Halbleiter</b><br>Platzhalter für Computerchips und Halbleiterversorgung. Datenquellen und Ampellogik werden später definiert.</div><div class="rule"><b>6 · Grundnahrungsmittel</b><br>Platzhalter für Weizen, Reis und Mais. Datenquellen und Ampellogik werden später definiert.</div><div class="rule"><b>7 · Straßengüterverkehr / Logistik</b><br>Beobachtet Kosten und Aktivität im Lkw- und Speditionssektor.</div><div class="rule"><b>8 · Lieferketten / Warenpreise</b>')

          base = re.sub(r'<script src="wholesale-dk(?:-v2)?\.js[^\"]*"></script>', '', base)
          base = re.sub(r'<script src="energy-ui\.js[^\"]*"></script>', '', base)
          base = re.sub(r'<script src="domino-ui-v2\.js[^\"]*"></script>', '', base)
          base = base.replace('</body>', '<script src="wholesale-dk-v2.js?v=20260820-1"></script><script src="domino-ui-v2.js?v=20260820-5"></script></body>')

          with open('index.html','w',encoding='utf-8') as f:
              f.write(base)
          PY
      - name: Commit restored dashboard
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "Restore dashboard with live energy UI"
            git push
          fi
