name: Update oil supply sensor 3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-oil-supply-sensor3.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl requests
      - name: Fetch EIA unplanned crude oil production outages
        shell: bash
        run: |
          python <<'PY'
          import io, requests, pandas as pd
          URL='https://www.eia.gov/outlooks/steo/xls/Fig10.xlsx'
          r=requests.get(URL,timeout=60,headers={'User-Agent':'DOMINO-dashboard/2.5 (+GitHub Actions)'})
          r.raise_for_status()
          sheets=pd.read_excel(io.BytesIO(r.content),sheet_name=None,header=None)
          for sheet,df in sheets.items():
              print('SHEET',sheet,'shape',df.shape)
              for rr in range(max(0,20),min(len(df),50)):
                  vals=[]
                  for c in range(df.shape[1]):
                      x=df.iat[rr,c]
                      if not pd.isna(x) and str(x).strip(): vals.append(f'c{c}={x}')
                  if vals: print('ROW',rr,' || '.join(vals))
          raise RuntimeError('diagnostic Fig10 layout dump')
          PY
