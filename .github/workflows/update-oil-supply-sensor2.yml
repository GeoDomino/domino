name: Update oil supply sensor 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-oil-supply-sensor2.yml'
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Fetch EIA OPEC spare capacity
        shell: bash
        run: |
          python <<'PY'
          import csv, io, json, math, re, requests, zipfile
          from datetime import datetime, timezone

          BULK_URL='https://www.eia.gov/opendata/bulk/STEO.zip'
          SERIES_ID='COPS_OPEC'
          NOW=datetime.now(timezone.utc)
          CUR_YEAR=NOW.year
          CUR_QUARTER=(NOW.month-1)//3+1

          r=requests.get(BULK_URL,timeout=90,headers={'User-Agent':'DOMINO-dashboard/2.6 (+GitHub Actions)'})
          r.raise_for_status()
          z=zipfile.ZipFile(io.BytesIO(r.content))
          rows=[]

          def add(period,value,source_member):
              if period is None or value is None: return
              s=str(period).strip()
              m=re.match(r'^(20\d{2})[-/]?(\d{2})$',s)
              if not m: return
              y,mo=int(m.group(1)),int(m.group(2))
              if not 1 <= mo <= 12: return
              try: v=float(value)
              except Exception: return
              if math.isfinite(v) and 0 <= v <= 20:
                  rows.append((y,mo,v,source_member))

          def is_target(sid):
              s=str(sid or '').strip().upper()
              return SERIES_ID in s

          def walk(obj,member):
              if isinstance(obj,dict):
                  sid=obj.get('seriesId') or obj.get('series_id') or obj.get('series') or obj.get('id')
                  if is_target(sid):
                      data=obj.get('data')
                      if isinstance(data,list):
                          for item in data:
                              if isinstance(item,(list,tuple)) and len(item)>=2:
                                  add(item[0],item[1],member)
                              elif isinstance(item,dict):
                                  add(item.get('period') or item.get('date'),item.get('value'),member)
                      add(obj.get('period') or obj.get('date'),obj.get('value'),member)
                  for v in obj.values(): walk(v,member)
              elif isinstance(obj,list):
                  for v in obj: walk(v,member)

          for member in z.namelist():
              if member.endswith('/'): continue
              raw=z.read(member)
              try: text=raw.decode('utf-8-sig')
              except Exception: continue
              if SERIES_ID not in text: continue
              try:
                  walk(json.loads(text),member)
              except Exception:
                  for line in text.splitlines():
                      if SERIES_ID not in line: continue
                      try: walk(json.loads(line),member)
                      except Exception: pass
              try:
                  reader=csv.DictReader(io.StringIO(text))
                  for d in reader:
                      sid=d.get('seriesId') or d.get('series_id') or d.get('series') or d.get('id')
                      if is_target(sid):
                          add(d.get('period') or d.get('date'),d.get('value'),member)
              except Exception: pass

          ded={(y,m):(v,member) for y,m,v,member in rows}
          qmonths=[m for m in range(1,13) if (m-1)//3+1==CUR_QUARTER]
          qvals=[(m,*ded[(CUR_YEAR,m)]) for m in qmonths if (CUR_YEAR,m) in ded]
          if len(qvals)<3:
              available=sorted((y,m,v) for (y,m),(v,_) in ded.items() if y>=CUR_YEAR-1)
              raise RuntimeError(f'EIA STEO bulk series {SERIES_ID}: current quarter incomplete; found {qvals}; recent={available[-18:]}')

          value=sum(v for _,v,_ in qvals)/3.0
          source_members=sorted(set(member for _,_,member in qvals))
          if value >= 5.0: status='green'; points=0
          elif value >= 3.0: status='yellow'; points=1
          elif value >= 1.5: status='orange'; points=2
          else: status='red'; points=3

          path='oil-supply.json'
          try: old=json.load(open(path,encoding='utf-8'))
          except Exception: old={}
          old.setdefault('components',{})
          old['components']['spare_capacity']={
              'sensor':2,'status':status,'points':points,'value':round(value,2),'unit':'mb/d',
              'label':'Sensor 2 Ölversorgung · OPEC Reservekapazität',
              'period':f'{CUR_YEAR} Q{CUR_QUARTER}','date':f'{CUR_YEAR}-Q{CUR_QUARTER}',
              'monthly_values':[{'month':f'{CUR_YEAR}-{m:02d}','value':round(v,3)} for m,v,_ in qvals],
              'source':'U.S. EIA Short-Term Energy Outlook · OPEC surplus crude oil production capacity',
              'series_id':SERIES_ID,'source_url':BULK_URL,'source_members':source_members,
              'parser':'eia-steo-bulk-cops-opec-v4'
          }
          old['sensor2_updated']=NOW.isoformat()
          old['sensor2_source_date']=f'{CUR_YEAR}-Q{CUR_QUARTER}'
          old['sensor2_note']='Misst die kurzfristig zusätzlich verfügbare OPEC-Rohölförderkapazität. Quartalswert = Mittel der drei monatlichen EIA-STEO-Werte COPS_OPEC. Ampel: grün >=5, gelb 3 bis <5, orange 1,5 bis <3, rot <1,5 Mio. Barrel/Tag.'
          with open(path,'w',encoding='utf-8') as f:
              json.dump(old,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(old['components']['spare_capacity'],ensure_ascii=False,indent=2))
          PY

      - name: Commit sensor 2 data
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add oil-supply.json
          git diff --cached --quiet || (git commit -m "Update oil supply sensor 2 spare capacity" && git push)
