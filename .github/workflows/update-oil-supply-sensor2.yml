name: Update oil supply sensor 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-oil-supply-sensor2.yml'
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl requests
      - name: Fetch EIA OPEC spare capacity
        shell: python
        run: |
          import io, json, math, re, requests, pandas as pd
          from datetime import datetime, timezone

          URL='https://www.eia.gov/outlooks/steo/xls/Fig6.xlsx'
          NOW=datetime.now(timezone.utc)
          CUR=(NOW.year,(NOW.month-1)//3+1)
          r=requests.get(URL,timeout=60,headers={'User-Agent':'DOMINO-dashboard/2.4 (+GitHub Actions)'})
          r.raise_for_status()
          sheets=pd.read_excel(io.BytesIO(r.content),sheet_name=None,header=None)

          def txt(x):
              return '' if pd.isna(x) else re.sub(r'\s+',' ',str(x)).strip().lower()
          def num(x):
              try:
                  v=float(x); return v if math.isfinite(v) else None
              except Exception: return None
          def period(x):
              s=str(x).strip().upper()
              m=re.search(r'(20\d{2})\s*[- ]?Q\s*([1-4])',s)
              return (int(m.group(1)),int(m.group(2))) if m else None

          candidates=[]
          for sheet,df in sheets.items():
              for rr in range(len(df)):
                  row=[txt(df.iat[rr,c]) for c in range(df.shape[1])]
                  if not any('opec' in x and ('spare' in x or 'surplus' in x) and 'capacity' in x for x in row):
                      continue
                  # Figure files commonly store period labels and values in following rows/columns.
                  for r2 in range(max(0,rr-5),min(len(df),rr+30)):
                      for c in range(df.shape[1]):
                          p=period(df.iat[r2,c])
                          if not p or p>CUR: continue
                          for vc in range(c+1,min(df.shape[1],c+5)):
                              v=num(df.iat[r2,vc])
                              if v is not None and 0 <= v <= 15:
                                  candidates.append((p,v,sheet,rr,r2,vc))

          # Fallback: find an explicit OPEC spare/surplus series header and aligned quarter columns.
          if not candidates:
              for sheet,df in sheets.items():
                  for rr in range(len(df)):
                      for c in range(df.shape[1]):
                          label=txt(df.iat[rr,c])
                          if 'opec' not in label or ('spare' not in label and 'surplus' not in label) or 'capacity' not in label:
                              continue
                          for hr in range(max(0,rr-10),rr+1):
                              for cc in range(c+1,df.shape[1]):
                                  p=period(df.iat[hr,cc]); v=num(df.iat[rr,cc])
                                  if p and p<=CUR and v is not None and 0<=v<=15:
                                      candidates.append((p,v,sheet,rr,rr,cc))

          if not candidates:
              raise RuntimeError('EIA OPEC spare capacity figure found no usable current-quarter value')

          (year,quarter),value,sheet,labelrow,datarow,col=max(candidates,key=lambda z:z[0])
          if value >= 5.0: status='green'; points=0
          elif value >= 3.0: status='yellow'; points=1
          elif value >= 1.5: status='orange'; points=2
          else: status='red'; points=3

          path='oil-supply.json'
          try: old=json.load(open(path,encoding='utf-8'))
          except Exception: old={}
          old.setdefault('components',{})
          old['components']['spare_capacity']={
              'sensor':2,
              'status':status,
              'points':points,
              'value':round(value,2),
              'unit':'mb/d',
              'label':'Sensor 2 Ölversorgung · OPEC Reservekapazität',
              'period':f'{year} Q{quarter}',
              'date':f'{year}-Q{quarter}',
              'source':'U.S. EIA Short-Term Energy Outlook · OPEC surplus crude oil production capacity',
              'source_url':URL,
              'parser':'opec-spare-capacity-v1',
              'sheet':sheet
          }
          old['sensor2_updated']=NOW.isoformat()
          old['sensor2_source_date']=f'{year}-Q{quarter}'
          old['sensor2_note']='Misst die kurzfristig zusätzlich verfügbare OPEC-Rohölförderkapazität. Ampel: grün >=5, gelb 3 bis <5, orange 1,5 bis <3, rot <1,5 Mio. Barrel/Tag.'
          with open(path,'w',encoding='utf-8') as f:
              json.dump(old,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(old['components']['spare_capacity'],ensure_ascii=False,indent=2))

      - name: Commit sensor 2 data
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add oil-supply.json
          git diff --cached --quiet || (git commit -m "Update oil supply sensor 2 spare capacity" && git push)
