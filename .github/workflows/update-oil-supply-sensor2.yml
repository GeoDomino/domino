name: Update oil supply sensor 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-oil-supply-sensor2.yml'
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl requests
      - name: Fetch EIA OPEC spare capacity
        shell: bash
        run: |
          python <<'PY'
          import io, json, math, re, requests, pandas as pd
          from datetime import datetime, timezone

          # Official EIA STEO figure listed as "OPEC surplus crude oil production capacity".
          URL='https://www.eia.gov/outlooks/steo/xls/Fig6.xlsx'
          NOW=datetime.now(timezone.utc)
          CUR=(NOW.year,(NOW.month-1)//3+1)
          r=requests.get(URL,timeout=60,headers={'User-Agent':'DOMINO-dashboard/2.4 (+GitHub Actions)'})
          r.raise_for_status()
          sheets=pd.read_excel(io.BytesIO(r.content),sheet_name=None,header=None)

          def text(x):
              return '' if pd.isna(x) else re.sub(r'\s+',' ',str(x)).strip()
          def lower(x): return text(x).lower()
          def num(x):
              try:
                  v=float(x); return v if math.isfinite(v) else None
              except Exception: return None
          def quarter(x):
              s=text(x).upper()
              # Accept EIA forms such as Q3 2026, 2026 Q3, 3Q26 and Q3-26.
              patterns=[
                  r'Q\s*([1-4])\D*(20\d{2})',
                  r'(20\d{2})\D*Q\s*([1-4])',
                  r'([1-4])\s*Q\s*(20\d{2}|\d{2})',
                  r'Q\s*([1-4])\D*(\d{2})'
              ]
              for i,p in enumerate(patterns):
                  m=re.search(p,s)
                  if not m: continue
                  if i==1:
                      y,q=int(m.group(1)),int(m.group(2))
                  else:
                      q,y=int(m.group(1)),int(m.group(2))
                      if y<100: y+=2000
                  return y,q
              return None

          candidates=[]
          for sheet,df in sheets.items():
              # Method A: locate the explicit OPEC total spare/surplus series row, then
              # pair its numeric cells with quarter labels found in nearby header rows.
              for rr in range(len(df)):
                  labels=[lower(df.iat[rr,c]) for c in range(df.shape[1])]
                  label=' | '.join(x for x in labels if x)
                  if 'opec' not in label or 'capacity' not in label or ('spare' not in label and 'surplus' not in label):
                      continue
                  # Prefer total OPEC, not the separate Middle East subset.
                  if 'middle east' in label: continue
                  for cc in range(df.shape[1]):
                      v=num(df.iat[rr,cc])
                      if v is None or not (0 <= v <= 15): continue
                      found=None
                      for hr in range(max(0,rr-15),rr+1):
                          p=quarter(df.iat[hr,cc])
                          if p:
                              found=p; break
                      if found and found<=CUR:
                          candidates.append((found,v,sheet,rr,cc,'aligned-quarter'))

              # Method B: quarter labels may be in the same row as values, as in the
              # STEO data-browser export. Search locally around an explicit series label.
              for rr in range(len(df)):
                  for lc in range(df.shape[1]):
                      lab=lower(df.iat[rr,lc])
                      if 'opec' not in lab or 'capacity' not in lab or ('spare' not in lab and 'surplus' not in lab) or 'middle east' in lab:
                          continue
                      for r2 in range(max(0,rr-8),min(len(df),rr+9)):
                          for cc in range(df.shape[1]):
                              p=quarter(df.iat[r2,cc])
                              if not p or p>CUR: continue
                              # Look for a value in the same column or immediately below.
                              for vr in range(r2,min(len(df),r2+8)):
                                  v=num(df.iat[vr,cc])
                                  if v is not None and 0<=v<=15:
                                      candidates.append((p,v,sheet,vr,cc,'local-quarter'))
                                      break

          if not candidates:
              # Print workbook structure into Actions log so a future EIA layout change
              # is diagnosable instead of silently creating a fantasy value.
              for sheet,df in sheets.items():
                  print('SHEET',sheet,'shape',df.shape)
                  for rr in range(len(df)):
                      row=' | '.join(text(df.iat[rr,c]) for c in range(df.shape[1]) if text(df.iat[rr,c]))
                      if 'OPEC' in row.upper() or re.search(r'Q[1-4].*20\d{2}|20\d{2}.*Q[1-4]',row,re.I):
                          print(rr,row[:1000])
              raise RuntimeError('EIA OPEC spare capacity figure found no usable current-quarter value')

          # Prefer current quarter, total-series aligned candidates, and values from the
          # explicit series row. Never substitute a future quarter.
          candidates.sort(key=lambda z:(z[0], z[5]=='aligned-quarter'), reverse=True)
          (year,quarter_no),value,sheet,row,col,method=candidates[0]
          if value >= 5.0: status='green'; points=0
          elif value >= 3.0: status='yellow'; points=1
          elif value >= 1.5: status='orange'; points=2
          else: status='red'; points=3

          path='oil-supply.json'
          try: old=json.load(open(path,encoding='utf-8'))
          except Exception: old={}
          old.setdefault('components',{})
          old['components']['spare_capacity']={
              'sensor':2,'status':status,'points':points,'value':round(value,2),'unit':'mb/d',
              'label':'Sensor 2 Ölversorgung · OPEC Reservekapazität',
              'period':f'{year} Q{quarter_no}','date':f'{year}-Q{quarter_no}',
              'source':'U.S. EIA Short-Term Energy Outlook · OPEC surplus crude oil production capacity',
              'source_url':URL,'parser':'opec-spare-capacity-v2','sheet':sheet,'method':method
          }
          old['sensor2_updated']=NOW.isoformat()
          old['sensor2_source_date']=f'{year}-Q{quarter_no}'
          old['sensor2_note']='Misst die kurzfristig zusätzlich verfügbare OPEC-Rohölförderkapazität. Ampel: grün >=5, gelb 3 bis <5, orange 1,5 bis <3, rot <1,5 Mio. Barrel/Tag.'
          with open(path,'w',encoding='utf-8') as f:
              json.dump(old,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(old['components']['spare_capacity'],ensure_ascii=False,indent=2))
          PY

      - name: Commit sensor 2 data
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add oil-supply.json
          git diff --cached --quiet || (git commit -m "Update oil supply sensor 2 spare capacity" && git push)
