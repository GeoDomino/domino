name: Update oil supply sensor 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-oil-supply-sensor1.yml'
  schedule:
    - cron: '20 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl requests
      - name: Fetch EIA world supply-demand balance
        shell: python
        run: |
          import io, json, math, re, requests, pandas as pd
          from datetime import datetime, timezone

          URL='https://www.eia.gov/outlooks/steo/xls/Fig2.xlsx'
          NOW=datetime.now(timezone.utc)
          CUR_YEAR=NOW.year
          CUR_Q=(NOW.month-1)//3+1
          UA={'User-Agent':'DOMINO-dashboard/2.2 (+GitHub Actions)'}

          r=requests.get(URL,timeout=60,headers=UA)
          r.raise_for_status()
          sheets=pd.read_excel(io.BytesIO(r.content),sheet_name=None,header=None)

          def txt(x):
              if pd.isna(x): return ''
              return re.sub(r'\s+',' ',str(x)).strip().lower()

          def num(x):
              try:
                  v=float(x)
                  return v if math.isfinite(v) else None
              except Exception:
                  return None

          def quarter_from_value(x):
              if pd.isna(x): return None
              # Real Excel/Pandas date
              try:
                  d=pd.to_datetime(x,errors='coerce')
                  if not pd.isna(d):
                      d=pd.Timestamp(d)
                      if 2000 <= d.year <= 2035:
                          return (d.year,(d.month-1)//3+1)
              except Exception:
                  pass
              s=txt(x).upper()
              # Q3 2026 / 2026 Q3 / 3Q26 etc.
              m=re.search(r'Q\s*([1-4]).*?(20\d{2})',s)
              if m: return (int(m.group(2)),int(m.group(1)))
              m=re.search(r'(20\d{2}).*?Q\s*([1-4])',s)
              if m: return (int(m.group(1)),int(m.group(2)))
              m=re.search(r'([1-4])\s*Q\s*(\d{2,4})',s)
              if m:
                  y=int(m.group(2)); y=y+2000 if y<100 else y
                  return (y,int(m.group(1)))
              return None

          def row_text(df,rr):
              return ' '.join(txt(x) for x in df.iloc[rr,:min(df.shape[1],12)].tolist())

          def find_rows(df):
              prod=[]; cons=[]
              for rr in range(len(df)):
                  s=row_text(df,rr)
                  # Current EIA wording is usually "world liquid fuels production/consumption".
                  if 'world' in s and 'production' in s and ('fuel' in s or 'liquid' in s): prod.append(rr)
                  elif 'world' in s and 'production' in s: prod.append(rr)
                  if 'world' in s and ('consumption' in s or 'demand' in s) and ('fuel' in s or 'liquid' in s): cons.append(rr)
                  elif 'world' in s and ('consumption' in s or 'demand' in s): cons.append(rr)
              return prod,cons

          def periods_for_columns(df,pr,cr):
              periods={}
              top=max(0,min(pr,cr)-15)
              bottom=min(pr,cr)
              # 1) Direct quarter/date labels in nearby header cells.
              for rr in range(top,bottom):
                  for c in range(df.shape[1]):
                      q=quarter_from_value(df.iat[rr,c])
                      if q: periods[c]=q
              # 2) Common EIA layout: year row + Q1/Q2/Q3/Q4 row.
              for yrrow in range(top,bottom):
                  years=[]
                  last_year=None
                  for c in range(df.shape[1]):
                      v=df.iat[yrrow,c]
                      y=None
                      try:
                          f=float(v)
                          if f.is_integer() and 2000 <= int(f) <= 2035: y=int(f)
                      except Exception:
                          m=re.fullmatch(r'20\d{2}',txt(v))
                          if m: y=int(m.group(0))
                      if y is not None: last_year=y
                      years.append(last_year)
                  if not any(years): continue
                  for qrow in range(yrrow,min(bottom,yrrow+4)):
                      for c in range(df.shape[1]):
                          s=txt(df.iat[qrow,c]).upper()
                          m=re.fullmatch(r'Q\s*([1-4])',s)
                          if m and years[c]: periods[c]=(years[c],int(m.group(1)))
              return periods

          def extract(df):
              prod,cons=find_rows(df)
              hits=[]
              for pr in prod:
                  for cr in cons:
                      if abs(pr-cr)>12: continue
                      periods=periods_for_columns(df,pr,cr)
                      for c,q in periods.items():
                          p=num(df.iat[pr,c]); d=num(df.iat[cr,c])
                          if p is None or d is None: continue
                          if q <= (CUR_YEAR,CUR_Q): hits.append((q,p-d,p,d,pr,cr,c))
              return max(hits,key=lambda z:z[0]) if hits else None

          found=[]
          diagnostics=[]
          for name,df in sheets.items():
              if df.empty: continue
              pr,cr=find_rows(df)
              diagnostics.append({'sheet':name,'production_rows':pr,'consumption_rows':cr,'shape':list(df.shape)})
              hit=extract(df)
              if hit: found.append((hit,name))

          if not found:
              print(json.dumps({'diagnostics':diagnostics},ensure_ascii=False,indent=2))
              raise RuntimeError('EIA Fig2 parsed, but current-quarter world production/consumption values were not found')

          ((year,quarter),balance,production,consumption,pr,cr,col),sheet=max(found,key=lambda z:z[0][0])
          deficit=max(0,-balance)
          if deficit>=5.0: status='red'; points=3
          elif deficit>=1.5: status='orange'; points=2
          elif deficit>=0.5: status='yellow'; points=1
          else: status='green'; points=0

          path='oil-supply.json'
          try: old=json.load(open(path,encoding='utf-8'))
          except Exception: old={}
          old.setdefault('version','2.2')
          old.setdefault('status','unknown')
          old.setdefault('label','WARTET')
          old.setdefault('score',None)
          old.setdefault('components',{})
          old['components']['supply_demand_balance']={
              'sensor':1,'status':status,'points':points,'value':round(balance,2),
              'production':round(production,2),'consumption':round(consumption,2),'unit':'mb/d',
              'label':'Sensor 1 Ölversorgung · Angebot/Nachfrage-Balance',
              'period':f'{year} Q{quarter}','date':f'{year}-Q{quarter}',
              'source':'U.S. EIA Short-Term Energy Outlook, World liquid fuels production and consumption balance (Fig2)',
              'source_url':URL,'parser':'quarter-header-v2','sheet':sheet
          }
          old['sensor1_updated']=NOW.isoformat()
          old['sensor1_source_date']=f'{year}-Q{quarter}'
          old['sensor1_note']='Misst, ob die weltweite Ölproduktion den weltweiten Verbrauch deckt oder ob ein Defizit bzw. Überschuss in Mio. Barrel pro Tag entsteht.'
          with open(path,'w',encoding='utf-8') as f:
              json.dump(old,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(old['components']['supply_demand_balance'],ensure_ascii=False,indent=2))

      - name: Commit sensor 1 data
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add oil-supply.json
          git diff --cached --quiet || (git commit -m "Update oil supply sensor 1 balance" && git push)
