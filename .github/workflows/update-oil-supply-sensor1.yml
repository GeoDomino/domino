name: Update oil supply sensor 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-oil-supply-sensor1.yml'
  schedule:
    - cron: '20 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl requests
      - name: Fetch EIA world supply-demand balance
        shell: python
        run: |
          import io, json, math, re, requests, pandas as pd
          from datetime import datetime, timezone
          URL='https://www.eia.gov/outlooks/steo/xls/Fig2.xlsx'
          NOW=datetime.now(timezone.utc); CUR_YEAR=NOW.year; CUR_Q=(NOW.month-1)//3+1
          r=requests.get(URL,timeout=60,headers={'User-Agent':'DOMINO-dashboard/2.3 (+GitHub Actions)'}); r.raise_for_status()
          sheets=pd.read_excel(io.BytesIO(r.content),sheet_name=None,header=None)
          def txt(x): return '' if pd.isna(x) else re.sub(r'\s+',' ',str(x)).strip().lower()
          def num(x):
              try:
                  v=float(x); return v if math.isfinite(v) else None
              except: return None
          def qparse(x):
              if pd.isna(x): return None
              s=txt(x).upper()
              for pat,swap in [(r'Q\s*([1-4]).*?(20\d{2})',True),(r'(20\d{2}).*?Q\s*([1-4])',False)]:
                  m=re.search(pat,s)
                  if m: return (int(m.group(2)),int(m.group(1))) if swap else (int(m.group(1)),int(m.group(2)))
              try:
                  d=pd.to_datetime(x,errors='coerce')
                  if not pd.isna(d) and 2000<=pd.Timestamp(d).year<=2035:
                      d=pd.Timestamp(d); return (d.year,(d.month-1)//3+1)
              except: pass
              return None
          def row_cells(df,rr): return [txt(v) for v in df.iloc[rr,:].tolist()]
          def label_rows(df):
              prod=[]; cons=[]
              for rr in range(len(df)):
                  cells=row_cells(df,rr)
                  for c,s in enumerate(cells):
                      if 'world' in s and 'production' in s and 'consumption' not in s: prod.append((rr,c,s))
                      if 'world' in s and ('consumption' in s or 'demand' in s) and 'production' not in s: cons.append((rr,c,s))
              return prod,cons
          def period_map(df,start,end):
              out={}
              for rr in range(max(0,start),min(len(df),end)):
                  for c in range(df.shape[1]):
                      q=qparse(df.iat[rr,c])
                      if q: out[c]=q
              # support separate year row + Q row
              for yrrow in range(max(0,start),min(len(df),end)):
                  years=[None]*df.shape[1]; last=None
                  for c in range(df.shape[1]):
                      s=txt(df.iat[yrrow,c]); m=re.fullmatch(r'20\d{2}',s)
                      if m: last=int(s)
                      years[c]=last
                  if not any(years): continue
                  for qrow in range(yrrow,min(len(df),yrrow+5,end)):
                      for c in range(df.shape[1]):
                          m=re.fullmatch(r'q\s*([1-4])',txt(df.iat[qrow,c]))
                          if m and years[c]: out[c]=(years[c],int(m.group(1)))
              return out
          found=[]; diag=[]
          for name,df in sheets.items():
              prod,cons=label_rows(df); diag.append({'sheet':name,'prod':prod,'cons':cons,'shape':list(df.shape)})
              for pr,pc,ps in prod:
                  for cr,cc,cs in cons:
                      if abs(pr-cr)>15: continue
                      periods=period_map(df,min(pr,cr)-20,min(pr,cr)+3)
                      for c,q in periods.items():
                          p=num(df.iat[pr,c]); d=num(df.iat[cr,c])
                          if p is not None and d is not None and q<=(CUR_YEAR,CUR_Q): found.append((q,p-d,p,d,name,pr,cr,c))
          if not found:
              # Print the actual worksheet rows once so future parser repairs are evidence-based.
              for name,df in sheets.items():
                  print('=== SHEET',name,df.shape,'===')
                  for rr in range(len(df)):
                      vals=[str(v) for v in df.iloc[rr,:].tolist() if not pd.isna(v)]
                      if vals: print(rr, ' | '.join(vals)[:1200])
              print('LABEL_DIAG',json.dumps(diag,ensure_ascii=False))
              raise RuntimeError('Could not locate separate EIA world production and consumption data rows')
          (year,quarter),balance,production,consumption,sheet,pr,cr,col=max(found,key=lambda z:z[0])
          deficit=max(0,-balance)
          if deficit>=5: status='red'; points=3
          elif deficit>=1.5: status='orange'; points=2
          elif deficit>=.5: status='yellow'; points=1
          else: status='green'; points=0
          path='oil-supply.json'
          try: old=json.load(open(path,encoding='utf-8'))
          except: old={}
          old.setdefault('components',{})
          old['components']['supply_demand_balance']={'sensor':1,'status':status,'points':points,'value':round(balance,2),'production':round(production,2),'consumption':round(consumption,2),'unit':'mb/d','label':'Sensor 1 Ölversorgung · Angebot/Nachfrage-Balance','period':f'{year} Q{quarter}','date':f'{year}-Q{quarter}','source':'U.S. EIA Short-Term Energy Outlook, Fig2','source_url':URL,'parser':'quarter-header-v3','sheet':sheet}
          old['sensor1_updated']=NOW.isoformat(); old['sensor1_source_date']=f'{year}-Q{quarter}'
          old['sensor1_note']='Misst, ob die weltweite Ölproduktion den weltweiten Verbrauch deckt oder ob ein Defizit bzw. Überschuss in Mio. Barrel pro Tag entsteht.'
          with open(path,'w',encoding='utf-8') as f: json.dump(old,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(old['components']['supply_demand_balance'],ensure_ascii=False,indent=2))
      - name: Commit sensor 1 data
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add oil-supply.json
          git diff --cached --quiet || (git commit -m "Update oil supply sensor 1 balance" && git push)
