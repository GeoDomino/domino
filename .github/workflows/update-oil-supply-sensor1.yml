name: Update oil supply sensor 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-oil-supply-sensor1.yml'
  schedule:
    - cron: '20 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl requests
      - name: Fetch EIA world supply-demand balance
        shell: python
        run: |
          import io, json, math, re, requests, pandas as pd
          from datetime import datetime, timezone

          URL='https://www.eia.gov/outlooks/steo/xls/Fig2.xlsx'
          NOW=datetime.now(timezone.utc)
          CUR=(NOW.year,(NOW.month-1)//3+1)
          r=requests.get(URL,timeout=60,headers={'User-Agent':'DOMINO-dashboard/2.4 (+GitHub Actions)'})
          r.raise_for_status()
          sheets=pd.read_excel(io.BytesIO(r.content),sheet_name=None,header=None)

          def txt(x):
              return '' if pd.isna(x) else re.sub(r'\s+',' ',str(x)).strip().lower()
          def num(x):
              try:
                  v=float(x); return v if math.isfinite(v) else None
              except Exception: return None
          def parse_period(x):
              s=txt(x).upper()
              m=re.search(r'(20\d{2})\s*[- ]?Q\s*([1-4])',s)
              if m: return (int(m.group(1)),int(m.group(2)))
              return None

          found=[]
          for sheet,df in sheets.items():
              for hr in range(len(df)):
                  headers={txt(df.iat[hr,c]):c for c in range(df.shape[1]) if txt(df.iat[hr,c])}
                  pcol=next((c for h,c in headers.items() if h=='world production'),None)
                  ccol=next((c for h,c in headers.items() if h=='world consumption'),None)
                  if pcol is None or ccol is None: continue
                  for rr in range(hr+1,len(df)):
                      period=None
                      for c in range(min(4,df.shape[1])):
                          period=parse_period(df.iat[rr,c])
                          if period: break
                      if not period: continue
                      p=num(df.iat[rr,pcol]); d=num(df.iat[rr,ccol])
                      if p is not None and d is not None and period<=CUR:
                          found.append((period,p-d,p,d,sheet,hr,rr,pcol,ccol))

          if not found:
              raise RuntimeError('EIA Fig2 table found no usable world production/consumption row')

          (year,quarter),balance,production,consumption,sheet,hr,rr,pcol,ccol=max(found,key=lambda z:z[0])
          deficit=max(0,-balance)
          if deficit>=5.0: status='red'; points=3
          elif deficit>=1.5: status='orange'; points=2
          elif deficit>=0.5: status='yellow'; points=1
          else: status='green'; points=0

          path='oil-supply.json'
          try: old=json.load(open(path,encoding='utf-8'))
          except Exception: old={}
          old.setdefault('components',{})
          old['components']['supply_demand_balance']={
              'sensor':1,
              'status':status,
              'points':points,
              'value':round(balance,2),
              'production':round(production,2),
              'consumption':round(consumption,2),
              'unit':'mb/d',
              'label':'Sensor 1 Ölversorgung · Angebot/Nachfrage-Balance',
              'period':f'{year} Q{quarter}',
              'date':f'{year}-Q{quarter}',
              'source':'U.S. EIA Short-Term Energy Outlook, Fig2',
              'source_url':URL,
              'parser':'explicit-fig2-table-v4',
              'sheet':sheet
          }
          old['sensor1_updated']=NOW.isoformat()
          old['sensor1_source_date']=f'{year}-Q{quarter}'
          old['sensor1_note']='Misst, ob die weltweite Ölproduktion den weltweiten Verbrauch deckt oder ob ein Defizit bzw. Überschuss in Mio. Barrel pro Tag entsteht.'
          with open(path,'w',encoding='utf-8') as f:
              json.dump(old,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(old['components']['supply_demand_balance'],ensure_ascii=False,indent=2))

      - name: Commit sensor 1 data
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add oil-supply.json
          git diff --cached --quiet || (git commit -m "Update oil supply sensor 1 balance" && git push)
