name: Update Brent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-brent:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Brent abrufen
        shell: python
        run: |
          import csv, io, json, re, urllib.request
          from datetime import datetime, timezone, date

          UA = {"User-Agent": "Mozilla/5.0 DOMINO-Brent-Monitor/2.0"}
          today = date.today()

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8-sig", errors="replace")

          candidates = []

          # 1) Yahoo Finance chart endpoint: aktueller Brent-Future BZ=F.
          # Liefert Markt-/Schlusskurse und Zeitstempel maschinenlesbar.
          try:
              raw = get("https://query1.finance.yahoo.com/v8/finance/chart/BZ%3DF?range=5d&interval=1d&includePrePost=false")
              y = json.loads(raw)
              result = y["chart"]["result"][0]
              meta = result.get("meta", {})
              price = meta.get("regularMarketPrice")
              ts = meta.get("regularMarketTime")
              if isinstance(price, (int, float)) and price > 0 and ts:
                  dt = datetime.fromtimestamp(ts, timezone.utc)
                  candidates.append({"date": dt.date().isoformat(), "value": float(price), "source": "Yahoo Finance BZ=F", "market_timestamp": dt.isoformat()})
          except Exception as e:
              print("Yahoo fehlgeschlagen:", repr(e))

          # 2) FRED/EIA als offizieller Fallback. Achtung: kann mehrere Tage hinterherhinken.
          try:
              text = get("https://fred.stlouisfed.org/graph/fredgraph.csv?id=DCOILBRENTEU")
              reader = csv.DictReader(io.StringIO(text))
              latest = None
              for row in reader:
                  d = (row.get("observation_date") or row.get("DATE") or "").strip()
                  rawv = (row.get("DCOILBRENTEU") or "").strip()
                  if not d or not rawv or rawv in (".", "NA", "N/A"):
                      continue
                  try: v = float(rawv)
                  except ValueError: continue
                  if v > 0: latest = {"date": d, "value": v, "source": "FRED DCOILBRENTEU"}
              if latest:
                  candidates.append(latest)
          except Exception as e:
              print("FRED fehlgeschlagen:", repr(e))

          if not candidates:
              raise RuntimeError("Keine Brent-Quelle lieferte einen gueltigen Wert")

          # Immer den zeitlich frischesten Datensatz nehmen.
          candidates.sort(key=lambda x: x["date"], reverse=True)
          latest = candidates[0]
          age_days = (today - date.fromisoformat(latest["date"])).days
          latest["age_days"] = age_days
          latest["stale"] = age_days > 3
          latest["updated_at"] = datetime.now(timezone.utc).isoformat()

          # Nie wieder einen alten Wert stillschweigend als 'heute' verkaufen.
          if age_days > 7:
              raise RuntimeError(f"Brent-Daten zu alt: {latest['date']} ({age_days} Tage)")

          with open("brent.json", "w", encoding="utf-8") as f:
              json.dump(latest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps(latest, ensure_ascii=False))

      - name: Brent speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brent.json
          if git diff --cached --quiet; then
            echo "Keine Änderung"
          else
            git commit -m "Update Brent price"
            git push
          fi
