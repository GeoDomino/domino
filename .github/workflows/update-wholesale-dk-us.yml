name: Update wholesale DK US

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14,20 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch US Gulf Coast ULSD
        shell: python
        run: |
          import csv, io, json, urllib.request
          from datetime import datetime
          url='https://fred.stlouisfed.org/graph/fredgraph.csv?id=DDFUELUSGULF'
          req=urllib.request.Request(url,headers={'User-Agent':'DOMINO/1.0'})
          text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8-sig')
          rows=[]
          for r in csv.DictReader(io.StringIO(text)):
              raw=(r.get('DDFUELUSGULF') or '').strip()
              if raw and raw!='.':
                  try: rows.append((r.get('DATE') or r.get('observation_date'),float(raw)))
                  except: pass
          if not rows: raise RuntimeError('No USGC ULSD data')
          date,value=rows[-1]
          level=0 if value<2.5 else 1 if value<3.5 else 2 if value<4.2 else 3
          old={}
          try: old=json.load(open('wholesale-dk-us.json'))
          except: pass
          old_level=old.get('level')
          old_days=int(old.get('days_in_status') or 0)
          old_date=old.get('source_date')
          if old_level==level and old_date and date!=old_date:
              try:
                  delta=(datetime.fromisoformat(date)-datetime.fromisoformat(old_date)).days
                  days=max(1,old_days+max(delta,0))
              except: days=max(1,old_days)
          elif old_level==level: days=max(1,old_days)
          else: days=1
          out={'market':'Amerika','benchmark':'U.S. Gulf Coast ULSD Spot','value':value,'unit':'USD/gal','source_date':date,'status':['green','yellow','orange','red'][level],'level':level,'days_in_status':days,'source':'U.S. EIA via FRED DDFUELUSGULF','thresholds':{'green_below':2.5,'yellow_from':2.5,'orange_from':3.5,'red_from':4.2}}
          json.dump(out,open('wholesale-dk-us.json','w'),indent=2,ensure_ascii=False)
      - name: Commit
        run: |
          git config user.name "DOMINO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add wholesale-dk-us.json
          git diff --cached --quiet || (git commit -m "Update US wholesale diesel" && git push)
