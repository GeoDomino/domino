name: Update US diesel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-diesel-us.yml'
  schedule:
    - cron: "25 10 * * 2"

permissions:
  contents: write

concurrency:
  group: update-diesel-us-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch US diesel
        shell: python
        run: |
          import csv, io, json, os, urllib.request
          from datetime import datetime, timezone, date

          # FRED sometimes stalls on the chart CSV endpoint. Try its
          # independent plain-text series export if the CSV request fails.
          import re, time
          urls = [
              "https://fred.stlouisfed.org/graph/fredgraph.csv?id=GASDESW",
              "https://fred.stlouisfed.org/data/GASDESW.txt",
          ]
          latest = None
          errors = []
          for url in urls:
              try:
                  print("Fetching", url, flush=True)
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (compatible; GeoDomino/1.0)",
                      "Accept": "text/csv,text/plain,*/*",
                  })
                  with urllib.request.urlopen(req, timeout=12) as response:
                      body = response.read().decode("utf-8-sig")
                  observations = []
                  for row in csv.reader(io.StringIO(body)):
                      if len(row) >= 2 and re.fullmatch(r"\d{4}-\d{2}-\d{2}", row[0].strip()):
                          try:
                              value = float(row[1].strip())
                              if 0 < value < 15:
                                  observations.append((row[0].strip(), value))
                          except ValueError:
                              pass
                  if not observations:
                      # FRED /data/ exports date/value pairs separated by whitespace.
                      for day, raw in re.findall(r"(?m)^\s*(\d{4}-\d{2}-\d{2})\s+([0-9]+(?:\.[0-9]+)?)\s*$", body):
                          value = float(raw)
                          if 0 < value < 15:
                              observations.append((day, value))
                  if not observations:
                      raise ValueError("No valid GASDESW date/value observations")
                  day, value = max(observations, key=lambda item: item[0])
                  latest = {"date": day, "value": value}
                  print("FRED observation:", latest, flush=True)
                  break
              except Exception as exc:
                  msg = f"{url}: {type(exc).__name__}: {exc}"
                  errors.append(msg)
                  print("Source failed:", msg, flush=True)
          if latest is None:
              raise RuntimeError("US diesel data unavailable from both FRED endpoints: " + "; ".join(errors))

          v = latest["value"]
          if v >= 5.80:
              status, label, level = "red", "ROT", 3
          elif v >= 4.70:
              status, label, level = "orange", "ORANGE", 2
          elif v >= 3.60:
              status, label, level = "yellow", "GELB", 1
          else:
              status, label, level = "green", "GRÜN", 0

          old = {}
          if os.path.exists("diesel-us.json"):
              try:
                  with open("diesel-us.json", encoding="utf-8") as f:
                      old = json.load(f)
              except Exception:
                  old = {}
          history = old.get("history", []) if isinstance(old, dict) else []
          snap = {"date": latest["date"], "value": round(v, 3)}
          # Keep only real dated observations, remove duplicates and sort.
          history = [item for item in history if isinstance(item, dict) and isinstance(item.get("date"), str) and isinstance(item.get("value"), (int, float))]
          history = [item for item in history if item["date"] <= latest["date"]]
          history.append(snap)
          by_date = {item["date"]: item for item in history}
          history = [by_date[day] for day in sorted(by_date)][-20:]
          trend = None
          if len(history) >= 2 and history[-2]["value"]:
              trend = round((history[-1]["value"] / history[-2]["value"] - 1) * 100, 2)

          # Data-quality guard. EIA/FRED is weekly; by Sunday a value from the
          # previous Sunday is already one full release cycle old.
          source_day = datetime.fromisoformat(latest["date"]).date()
          today = datetime.now(timezone.utc).date()
          age_days = (today - source_day).days
          expected_max_age_days = 8
          quality_reasons = []
          if age_days > expected_max_age_days:
              quality_reasons.append(f"EIA-Wochenwert {age_days} Tage alt")
          if not (1.5 <= v <= 15.0):
              quality_reasons.append("Preis außerhalb Plausibilitätsbereich")
          if trend is not None and abs(trend) >= 20:
              quality_reasons.append(f"Wochensprung {trend:+.1f}% verlangt Gegenprüfung")
          data_quality = "compromised" if quality_reasons else "ok"

          out = {
              "version":"1.1",
              "market":"USA",
              "product":"DK",
              "value":round(v,3),
              "unit":"USD/gal",
              "status":status,
              "label":label,
              "level":level,
              "trend_pct_last_observation":trend,
              "source_date":latest["date"],
              "updated_at":datetime.now(timezone.utc).isoformat(),
              "source":"U.S. EIA / FRED GASDESW",
              "data_quality":data_quality,
              "data_quality_ok":data_quality == "ok",
              "data_age_days":age_days,
              "expected_max_age_days":expected_max_age_days,
              "quality_reasons":quality_reasons,
              "quality_method":"Freshness + physical sanity range + weekly jump check. A failed check preserves the market value/status but requires gray UI until validated.",
              "thresholds":{"green_below":3.60,"yellow_from":3.60,"orange_from":4.70,"red_from":5.80},
              "history":history
          }
          with open("diesel-us.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
              f.write("\n")

      - name: Save US diesel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -euo pipefail
          git add diesel-us.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung"
            exit 0
          fi
          git commit -m "Update US diesel price"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflict, retrying ($attempt/3)"
            sleep 3
          done
          echo "ERROR: Could not push US diesel data" >&2
          exit 1
