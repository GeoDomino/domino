name: Update US diesel

on:
  workflow_dispatch:
  schedule:
    - cron: "25 10 * * 2"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch US diesel
        shell: python
        run: |
          import csv, io, json, os, urllib.request
          from datetime import datetime, timezone

          url = "https://fred.stlouisfed.org/graph/fredgraph.csv?id=GASDESW"
          req = urllib.request.Request(url, headers={"User-Agent":"DOMINO-Diesel-US/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              text = response.read().decode("utf-8-sig")

          reader = csv.DictReader(io.StringIO(text))
          latest = None
          for row in reader:
              raw = (row.get("GASDESW") or "").strip()
              date = (row.get("observation_date") or row.get("DATE") or "").strip()
              if not raw or raw in (".", "NA", "N/A"):
                  continue
              try:
                  value = float(raw)
              except ValueError:
                  continue
              if value > 0:
                  latest = {"date": date, "value": value}

          if latest is None:
              raise RuntimeError("Kein gueltiger US-Dieselwert gefunden")

          v = latest["value"]
          if v >= 5.80:
              status, label, level = "red", "ROT", 3
          elif v >= 4.70:
              status, label, level = "orange", "ORANGE", 2
          elif v >= 3.60:
              status, label, level = "yellow", "GELB", 1
          else:
              status, label, level = "green", "GRÜN", 0

          old = {}
          if os.path.exists("diesel-us.json"):
              try:
                  with open("diesel-us.json", encoding="utf-8") as f:
                      old = json.load(f)
              except Exception:
                  old = {}
          history = old.get("history", []) if isinstance(old, dict) else []
          snap = {"date": latest["date"], "value": round(v, 3)}
          if not history or history[-1] != snap:
              history.append(snap)
          history = history[-20:]
          trend = None
          if len(history) >= 2 and history[-2]["value"]:
              trend = round((history[-1]["value"] / history[-2]["value"] - 1) * 100, 2)

          out = {
              "version":"1.0",
              "market":"USA",
              "product":"DK",
              "value":round(v,3),
              "unit":"USD/gal",
              "status":status,
              "label":label,
              "level":level,
              "trend_pct_last_observation":trend,
              "source_date":latest["date"],
              "updated_at":datetime.now(timezone.utc).isoformat(),
              "source":"U.S. EIA / FRED GASDESW",
              "thresholds":{"green_below":3.60,"yellow_from":3.60,"orange_from":4.70,"red_from":5.80},
              "history":history
          }
          with open("diesel-us.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
              f.write("\n")

      - name: Save US diesel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diesel-us.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung"
          else
            git commit -m "Update US diesel price"
            git push
          fi
