<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>DOMINO</title>
<style>
:root{--bg:#0f1115;--card:#181b21;--text:#f4f4f5;--muted:#8b929e;--green:#22c55e;--yellow:#eab308;--orange:#f97316;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.wrap{max-width:560px;margin:0 auto;padding:18px 14px 32px}h1{text-align:center;font-size:24px;margin:2px 0 18px;letter-spacing:.5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border-radius:17px;padding:13px 10px;text-align:center;border:1px solid rgba(255,255,255,.05);min-height:150px}.name{font-size:18px;font-weight:750;margin-bottom:9px}.light{width:68px;height:68px;border-radius:50%;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;background:var(--green);box-shadow:0 0 25px rgba(34,197,94,.22)}.statusword{font-size:11px;font-weight:850;color:#07120a}.price{font-size:22px;font-weight:800;letter-spacing:-.4px}.small{font-size:11px;color:var(--muted);margin-top:3px}.placeholder{opacity:.18}details{margin-top:12px;background:var(--card);border-radius:14px;border:1px solid rgba(255,255,255,.05)}summary{cursor:pointer;list-style:none;padding:13px 15px;font-weight:700;font-size:14px}.detailbody{padding:0 15px 15px;color:var(--muted);font-size:13px;line-height:1.65}.error{display:none;color:#fca5a5;font-size:11px;margin-top:4px}
</style></head><body><div class="wrap"><h1>DOMINO</h1><div class="grid">
<div class="card"><div class="name">Brent</div><div class="light" id="light"><span class="statusword" id="status">Lädt</span></div><div class="price" id="price">–</div><div class="small" id="date"></div><div class="error" id="error"></div></div>
<div class="card placeholder"><div class="name">Indiz 2</div><div class="light"></div><div class="price">–</div></div><div class="card placeholder"><div class="name">Indiz 3</div><div class="light"></div><div class="price">–</div></div><div class="card placeholder"><div class="name">Indiz 4</div><div class="light"></div><div class="price">–</div></div><div class="card placeholder"><div class="name">Indiz 5</div><div class="light"></div><div class="price">–</div></div><div class="card placeholder"><div class="name">Indiz 6</div><div class="light"></div><div class="price">–</div></div><div class="card placeholder"><div class="name">Indiz 7</div><div class="light"></div><div class="price">–</div></div><div class="card placeholder"><div class="name">Indiz 8</div><div class="light"></div><div class="price">–</div></div></div>
<details><summary>ⓘ Details</summary><div class="detailbody"><b>Brent</b><br>🟢 unter 100 $ · 🟡 100–&lt;120 $ · 🟠 120–&lt;150 $ · 🔴 ab 150 $<br><br>Quelle: U.S. EIA / FRED. Die Datendatei wird automatisch auf GitHub aktualisiert.</div></details></div>
<script>
const colors={green:'#22c55e',yellow:'#eab308',orange:'#f97316',red:'#ef4444'};
function classify(v){if(v>=150)return['ROT',colors.red,'rgba(239,68,68,.28)'];if(v>=120)return['ORANGE',colors.orange,'rgba(249,115,22,.28)'];if(v>=100)return['GELB',colors.yellow,'rgba(234,179,8,.28)'];return['GRÜN',colors.green,'rgba(34,197,94,.28)']}
function render(x){const [l,col,g]=classify(Number(x.value));status.textContent=l;light.style.background=col;light.style.boxShadow=`0 0 28px ${g}`;price.textContent=Number(x.value).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' $';date.textContent=x.date?new Date(x.date+'T12:00:00').toLocaleDateString('de-DE'):''}
async function loadBrent(){error.style.display='none';status.textContent='Lädt';try{const r=await fetch('./brent.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const x=await r.json();if(typeof x.value!=='number')throw 0;render(x)}catch(e){status.textContent='?';price.textContent='–';date.textContent='';error.textContent='Wartet auf Brent-Daten';error.style.display='block'}}
loadBrent();setInterval(loadBrent,3600000);
</script></body></html>
